[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meddial"
version = "0.2.0"
description = "Knowledge-controlled synthetic clinical dialogue research framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alon Gottlib"}]
dependencies = [
  "pandas>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
azure = [
  "azure-ai-inference>=1.0.0b9,<2.0",
  "azure-core>=1.30,<2.0",
]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools]
include-package-data = true
py-modules = ["dialogue_generation_framework", "gtmf_creation", "simulation"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meddial*", "Agents*", "Models*", "Utils*"]

[tool.setuptools.package-data]
meddial = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "Agents/", "Utils/", "gtmf_creation.py"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true
