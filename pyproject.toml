[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meddial"
version = "0.1.0"
description = "Synthetic patient-physician dialogue generation and evaluation research framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alon Gottlib" }]
# What the pipeline itself needs: the models, the config layer, the loopback
# HTTP client, and the tabular reader. meddial-cohort and meddial-scr import
# nothing beyond this, which is what lets a hosted runtime install the package
# without dragging a machine-learning stack in behind it.
dependencies = [
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "pandas>=2.0,<3.0",
]

[project.scripts]
meddial-cohort = "meddial.cli:cohort_main"
meddial-scr = "meddial.cli:scr_main"
meddial-run = "meddial.cli:run_main"
meddial-tables = "meddial.cli:tables_main"

[project.optional-dependencies]
# The scoring stack: the DeepEval judge and the discriminability benchmark.
# Separated from the core because cohort selection and reference extraction
# import none of it, and installing it is not free -- it is several gigabytes,
# and on a hosted runtime it fights the packages that are already there. A
# Colab image ships huggingface-hub 1.x for its own gradio and diffusers; an
# upper bound here that forces transformers 4.x drags the hub back to 0.x and
# breaks both. So the bounds are only the ones a released version of this
# project has actually been run against: transformers 5.x and
# sentence-transformers 5.x are what the development machine runs today.
eval = [
  "nltk>=3.8,<4.0",
  "rouge-score>=0.1.2,<0.2",
  "scikit-learn>=1.4,<2.0",
  "sentence-transformers>=2.7",
  "transformers>=4.40",
  "torch>=2.2,<3.0",
  "deepeval>=3.0,<5.0",
]
dev = [
  "meddial[eval]",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]
# Read MIMIC-III from physionet-data on BigQuery instead of local CSVs
# (meddial-cohort --bigquery). Optional because the CSV path must keep working
# on a machine with no cloud account at all. db-dtypes is what lets a BigQuery
# DATE column arrive as a pandas date rather than an object; bigquery-storage
# is the fast download path for NOTEEVENTS, the one large table here.
bigquery = [
  "google-cloud-bigquery>=3.20,<4.0",
  "google-cloud-bigquery-storage>=2.24,<3.0",
  "db-dtypes>=1.2,<2.0",
  "pyarrow>=14.0",
]

[tool.setuptools]
include-package-data = true
py-modules = ["dialogue_generation_framework", "gtmf_creation", "simulation"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meddial*", "Agents*", "Utils*", "scripts*"]

[tool.setuptools.package-data]
# Evaluator prompts are versioned artefacts, not incidental assets: a score's
# prompt_version is the hash of one of these files, so they must ship.
"meddial.evaluation" = ["templates/*.md"]
"meddial.benchmarks" = ["templates/*.md", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
